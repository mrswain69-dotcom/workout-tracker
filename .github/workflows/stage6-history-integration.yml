name: Stage 6 Assessment History Integration

on:
  push:
    branches:
      - feature/phase2-assessments
    paths:
      - .github/workflows/stage6-history-integration.yml
      - scripts/stage6-integrate-history.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase2-assessments
          fetch-depth: 0
      - name: Apply guarded Stage 6 integration
        run: node scripts/stage6-integrate-history.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/assessments/AssessmentHistory.jsx src/components/assessments/AssessmentHub.jsx src/components/assessments/AssessmentHub.test.jsx
          git diff --cached --check
          git commit -m "Integrate derived Assessment progress"
          git push origin HEAD:feature/phase2-assessments
