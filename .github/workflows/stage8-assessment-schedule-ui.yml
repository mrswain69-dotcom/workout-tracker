name: Stage 8 Assessment Schedule UI Integration

on:
  push:
    branches:
      - feature/phase2-assessments
    paths:
      - .github/workflows/stage8-assessment-schedule-ui.yml
      - scripts/stage8-assessment-schedule-ui.mjs
      - scripts/stage8-assessment-schedule-ui-v2.mjs

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase2-assessments
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply guarded Stage 8 UI integration
        run: node scripts/stage8-assessment-schedule-ui-v2.mjs
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=low
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/assessments/AssessmentHub.jsx src/components/assessments/AssessmentHub.test.jsx
          git diff --cached --check
          git commit -m "Integrate recurring Assessment schedule UI"
          git push origin HEAD:feature/phase2-assessments
