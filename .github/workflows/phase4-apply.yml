name: Phase 4 Guarded Patch

on:
  push:
    branches:
      - feature/phase4-analysis
    paths:
      - scripts/phase4-apply.py
      - .github/workflows/phase4-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase4-analysis
      - name: Apply guarded Phase 4 patch
        run: python scripts/phase4-apply.py
      - name: Commit patch output
        run: |
          if git diff --quiet; then
            echo "No patch output required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 4: apply guarded integration patch"
          git push origin HEAD:feature/phase4-analysis
