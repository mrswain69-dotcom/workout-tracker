name: Phase 4 Stage 6 Hardening

on:
  push:
    branches:
      - feature/phase4-analysis
    paths:
      - scripts/phase4-stage6-hardening.py
      - .github/workflows/phase4-stage6-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase4-analysis
      - name: Apply guarded Stage 6 hardening
        run: python scripts/phase4-stage6-hardening.py
      - name: Commit patch output
        run: |
          if git diff --quiet; then
            echo "No patch output required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/progress/ProgressDashboard.jsx src/components/progress/AssessmentAnalysisProgress.css src/components/progress/ProgressDashboardPhase4Stage5.test.jsx src/engine/assessmentAnalysisEvidenceEngine.js src/engine/assessmentAnalysisConsistencyEngine.js src/engine/assessmentAnalysisViewModel.js src/engine/assessmentAnalysisEngine.js
          git commit -m "Phase 4 Stage 6: harden Analysis and lazy-load slice"
          git push origin HEAD:feature/phase4-analysis
