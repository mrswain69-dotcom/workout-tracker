name: Stage 6 engine copy helper

on:
  push:
    branches:
      - feature/group-team-ecosystem
    paths:
      - .github/workflows/stage6-copy-engines.yml

permissions:
  contents: write

jobs:
  copy-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/group-team-ecosystem
          fetch-depth: 0

      - name: Copy authoritative engines into Stage 6 Edge Function
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/group-seasons-awards
          cp supabase/functions/group-xp-leaderboard/xpEngine.js supabase/functions/group-seasons-awards/xpEngine.js
          cp supabase/functions/group-xp-leaderboard/xpRewardMap.generated.js supabase/functions/group-seasons-awards/xpRewardMap.generated.js
          cp supabase/functions/group-consistency-leaderboard/consistencyEngine.js supabase/functions/group-seasons-awards/consistencyEngine.js
          cp supabase/functions/group-improvement-leaderboard/improvementEngine.js supabase/functions/group-seasons-awards/improvementEngine.js
          cp src/engine/groupPeriodEngine.js supabase/functions/group-seasons-awards/groupPeriodEngine.js

      - name: Commit copied engines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/group-seasons-awards
          if git diff --cached --quiet; then
            echo "No engine copy changes required."
            exit 0
          fi
          git commit -m "Copy authoritative engines for Stage 6"
          git push origin HEAD:feature/group-team-ecosystem
