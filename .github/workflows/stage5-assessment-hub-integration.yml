name: Stage 5 Assessment Hub Integration

on:
  push:
    branches:
      - feature/phase2-assessments
    paths:
      - .github/workflows/stage5-assessment-hub-integration.yml
      - scripts/stage5-integrate-assessment-hub.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase2-assessments
          fetch-depth: 0
      - name: Apply guarded app integration
        run: node scripts/stage5-integrate-assessment-hub.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          git diff --cached --check
          git commit -m "Expose athlete Assessment runner in main app"
          git push origin HEAD:feature/phase2-assessments
