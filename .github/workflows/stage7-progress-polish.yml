name: Stage 7 Progress Polish

on:
  push:
    branches:
      - feature/phase3-progress-dashboard
    paths:
      - scripts/stage7-progress-polish.py
      - .github/workflows/stage7-progress-polish.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase3-progress-dashboard
      - name: Apply guarded Stage 7 dashboard patch
        run: python3 scripts/stage7-progress-polish.py
      - name: Verify patched source
        run: |
          grep -q 'buildTrainingRangeViews' src/components/progress/ProgressDashboard.jsx
          grep -q 'Training detail range' src/components/progress/ProgressDashboard.jsx
          grep -q 'Legacy workout history retained below' src/components/progress/ProgressDashboard.jsx
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/progress/ProgressDashboard.jsx
          if git diff --cached --quiet; then
            echo "No Stage 7 integration changes required"
          else
            git commit -m "Integrate Stage 7 Progress range polish"
            git push origin HEAD:feature/phase3-progress-dashboard
          fi
