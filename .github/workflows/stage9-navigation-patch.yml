name: Stage 9 Navigation Patch

on:
  push:
    branches:
      - feature/group-team-ecosystem
    paths:
      - .github/workflows/stage9-navigation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/group-team-ecosystem
          fetch-depth: 0

      - name: Apply Stage 9 patch
        run: python scripts/stage9-nav-patch.py

      - name: Commit clean Stage 9 navigation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Stage 9 navigation integration"
          git push origin HEAD:feature/group-team-ecosystem
