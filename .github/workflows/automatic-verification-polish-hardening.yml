name: Automatic verification polish hardening

on:
  push:
    branches:
      - feature/automatic-verification-polish

permissions:
  contents: write

jobs:
  harden-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/automatic-verification-polish
          fetch-depth: 0

      - name: Apply hardening patch
        run: python scripts/automatic-verification-polish-hardening.py

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Remove temporary hardening machinery
        run: rm scripts/automatic-verification-polish-hardening.py .github/workflows/automatic-verification-polish-hardening.yml

      - name: Commit hardened source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/verificationReconcile.ts \
            supabase/functions/verification-actions/index.ts \
            supabase/functions/strava-webhook/index.ts \
            src/components/progress/VerifiedActivityEvidenceSection.jsx \
            src/engine/verificationAutomaticPolish.test.js
          git add -u scripts/automatic-verification-polish-hardening.py .github/workflows/automatic-verification-polish-hardening.yml
          git commit -m "Harden automatic verification session boundaries"
          git push origin HEAD:feature/automatic-verification-polish
