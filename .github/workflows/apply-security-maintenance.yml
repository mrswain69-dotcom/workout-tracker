name: Apply security maintenance

on:
  push:
    branches:
      - maintenance/security-deps-2026-09
    paths:
      - .github/workflows/apply-security-maintenance.yml

permissions:
  contents: write

jobs:
  upgrade-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/security-deps-2026-09
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply reviewed dependency and CI upgrades
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          p.dependencies['@supabase/supabase-js'] = '^2.116.0'
          p.dependencies['react'] = '^18.3.1'
          p.dependencies['react-dom'] = '^18.3.1'
          p.dependencies['recharts'] = '^3.10.1'
          p.devDependencies['@testing-library/react'] = '^16.3.0'
          p.devDependencies['@vitejs/plugin-react'] = '^6.1.1'
          p.devDependencies['jsdom'] = '^26.1.0'
          p.devDependencies['vite'] = '^8.2.2'
          p.devDependencies['vitest'] = '^5.0.0'
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')
          NODE

          cat > .github/workflows/phase1-sessions-ci.yml <<'YAML'
          name: Workout Tracker CI

          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main

          jobs:
            test-and-build:
              runs-on: ubuntu-latest
              timeout-minutes: 10

              steps:
                - name: Checkout
                  uses: actions/checkout@v7

                - name: Use Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm

                - name: Install locked dependencies
                  run: npm ci --no-audit --no-fund

                - name: Run tests
                  run: npm test

                - name: Build app
                  run: npm run build

                - name: Security audit
                  run: npm audit --audit-level=low
          YAML
          sed -i 's/^          //' .github/workflows/phase1-sessions-ci.yml

      - name: Generate reproducible lockfile and install
        run: npm install --no-audit --no-fund

      - name: Verify Recharts public API used by the app
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import * as R from 'recharts'
          for (const k of ['LineChart','Line','XAxis','YAxis','Tooltip','ResponsiveContainer','CartesianGrid']) {
            if (!R[k]) throw new Error(`Missing Recharts export ${k}`)
          }
          NODE

      - name: Run full test suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Require a clean npm audit
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'))
          console.log(JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2))
          if ((audit.metadata?.vulnerabilities?.total || 0) !== 0) process.exit(1)
          NODE

      - name: Commit only verified maintenance files
        shell: bash
        run: |
          git config user.name "Workout Tracker Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/phase1-sessions-ci.yml
          git diff --cached --check
          git commit -m "Secure and modernise frontend toolchain"
          git push origin HEAD:maintenance/security-deps-2026-09
