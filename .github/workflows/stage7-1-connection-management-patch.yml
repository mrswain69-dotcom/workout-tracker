name: Stage 7.1 Connection Management Patch

on:
  push:
    branches:
      - feature/verified-activity-layer
    paths:
      - scripts/stage7-1-apply.mjs
      - .github/workflows/stage7-1-connection-management-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/verified-activity-layer
          fetch-depth: 0

      - name: Apply Stage 7.1 patch
        run: node scripts/stage7-1-apply.mjs

      - name: Remove temporary patch files
        run: |
          rm -f scripts/stage7-1-apply.mjs
          rm -f .github/workflows/stage7-1-connection-management-patch.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "stage7.1: wire connection management architecture"
          git push origin HEAD:feature/verified-activity-layer
