name: Stage 12 Session Logger Patch

on:
  push:
    branches:
      - feature/phase1-sessions
    paths:
      - scripts/stage12-apply.mjs
      - src/components/sessions/SessionLogger.test.jsx
      - .github/workflows/stage12-session-logger-patch.yml

permissions:
  contents: write

jobs:
  apply-stage12:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase1-sessions
          fetch-depth: 0

      - name: Apply guarded Stage 12 patch
        run: node scripts/stage12-apply.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Commit Stage 12 integration
        run: |
          if git diff --quiet; then
            echo "No Stage 12 patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          git commit -m "Integrate structured Session logger"
          git push origin HEAD:feature/phase1-sessions
