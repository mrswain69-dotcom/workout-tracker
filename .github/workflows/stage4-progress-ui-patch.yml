name: Stage 4 Progress UI Patch

on:
  push:
    branches:
      - feature/phase3-progress-dashboard

permissions:
  contents: write

jobs:
  apply-stage4-progress-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Stage 4 branch
        uses: actions/checkout@v7
        with:
          ref: feature/phase3-progress-dashboard
          fetch-depth: 1

      - name: Apply guarded Progress UI patch
        run: node scripts/stage4-progress-ui-patch.mjs

      - name: Commit patch when required
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "Stage 4 App integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Integrate Phase 3 Stage 4 Progress UI"
          git push origin HEAD:feature/phase3-progress-dashboard
