name: Phase 4 Stage 1 Session Tag Snapshot Patch

on:
  push:
    branches:
      - feature/phase4-analysis
    paths:
      - scripts/phase4-stage1-session-tags.py
      - .github/workflows/phase4-stage1-session-tags.yml

permissions:
  contents: write

jobs:
  patch-session-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase4-analysis
      - name: Apply guarded Session snapshot patch
        run: python scripts/phase4-stage1-session-tags.py
      - name: Commit patched Session engine
        run: |
          if git diff --quiet -- src/engine/sessionEngine.js; then
            echo "No Session engine patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/sessionEngine.js
          git commit -m "Stage 1: freeze Development Tags in Session snapshots"
          git push origin HEAD:feature/phase4-analysis
