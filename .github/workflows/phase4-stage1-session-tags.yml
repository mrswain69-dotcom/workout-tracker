name: Phase 4 Stage 1 Session Tag Snapshot Patch

on:
  push:
    branches:
      - feature/phase4-analysis
    paths:
      - scripts/phase4-stage1-session-tags.py
      - .github/workflows/phase4-stage1-session-tags.yml

permissions:
  contents: write

jobs:
  patch-session-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase4-analysis
      - name: Apply guarded Stage 1 patch
        run: python scripts/phase4-stage1-session-tags.py
      - name: Commit guarded patch output
        run: |
          if git diff --quiet -- src/engine/sessionEngine.js src/engine/assessmentAnalysisEvidenceEngine.test.js; then
            echo "No Stage 1 patch output required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/sessionEngine.js src/engine/assessmentAnalysisEvidenceEngine.test.js
          git commit -m "Stage 1: correct Assessment evidence fixture"
          git push origin HEAD:feature/phase4-analysis
