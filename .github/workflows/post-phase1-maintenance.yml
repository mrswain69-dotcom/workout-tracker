name: Post Phase 1 maintenance patch

on:
  push:
    branches:
      - maintenance/post-phase1-warnings
    paths:
      - .github/workflows/post-phase1-maintenance.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/post-phase1-warnings
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply narrowly-scoped maintenance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')
          old = '  cardioProgressXp,\n  extraXp: cardioXp, // legacy column used as "cardio" previously'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one duplicate cardioProgressXp sequence, found {text.count(old)}')
          new = '  extraXp: cardioXp, // legacy column used as "cardio" previously'
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('vite.config.js').write_text("""import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            build: {
              rollupOptions: {
                output: {
                  manualChunks(id) {
                    if (!id.includes('/node_modules/')) return undefined
                    if (id.includes('/node_modules/recharts/')) return 'charts-recharts'
                    if (
                      id.includes('/node_modules/d3-') ||
                      id.includes('/node_modules/internmap/') ||
                      id.includes('/node_modules/delaunator/') ||
                      id.includes('/node_modules/robust-predicates/')
                    ) return 'charts-d3'
                    if (
                      id.includes('/node_modules/react/') ||
                      id.includes('/node_modules/react-dom/') ||
                      id.includes('/node_modules/scheduler/')
                    ) return 'react-vendor'
                    if (id.includes('/node_modules/@supabase/')) return 'supabase-vendor'
                    return 'vendor'
                  },
                },
              },
            },
          })
          """.replace('          ', ''), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build and reject inherited warning regressions
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          if grep -Fq 'Duplicate key "cardioProgressXp"' /tmp/build.log; then
            echo 'Duplicate cardioProgressXp warning is still present.'
            exit 1
          fi
          if grep -Fq 'Some chunks are larger than 500 kB after minification' /tmp/build.log; then
            echo 'Oversized chunk warning is still present.'
            exit 1
          fi

      - name: Commit tested fixes
        shell: bash
        run: |
          git config user.name "Workout Tracker Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx vite.config.js
          git diff --cached --check
          git commit -m "Clean inherited build warnings"
          git push origin HEAD:maintenance/post-phase1-warnings
