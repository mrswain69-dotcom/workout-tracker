name: Stage 7.3 Safety Patch

on:
  push:
    branches:
      - feature/verification-stage7-3-auto-population

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply deterministic safety patch
        run: node scripts/stage7-3-safety.mjs
      - name: Verify intended markers
        run: |
          grep -q 'hasUniqueSafeTarget' src/engine/verificationAutoPopulationEngine.js
          grep -q 'persist' scripts/stage7-3-safety.mjs
          grep -q 'savedState' supabase/functions/_shared/verificationAutoPopulate.ts
      - name: Commit only intended source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/verificationAutoPopulationEngine.js supabase/functions/_shared/verificationAutoPopulate.ts
          git rm .github/workflows/stage7-3-safety-patch.yml scripts/stage7-3-safety.mjs
          git commit -m "Stage 7.3 harden ambiguous target and manual override handling"
          git push origin HEAD:feature/verification-stage7-3-auto-population
