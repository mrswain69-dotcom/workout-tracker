name: Stage 7.3 Finish Patch

on:
  push:
    branches:
      - feature/verification-stage7-3-auto-population

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply deterministic patch
        run: node scripts/stage7-3-finish.mjs
      - name: Verify intended markers
        run: |
          grep -q 'externalLogRevision' src/App.jsx
          grep -q 'onAutoPopulationChanged' src/App.jsx
          grep -q 'applyRecentVerifiedAutoPopulationForProfile' supabase/functions/_shared/verificationReconcile.ts
      - name: Commit only intended source changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx supabase/functions/_shared/verificationReconcile.ts
          git rm .github/workflows/stage7-3-finish-patch.yml scripts/stage7-3-finish.mjs
          echo "Staged files:"
          git diff --cached --name-only
          git commit -m "Stage 7.3 wire automatic population into reconciliation and Log refresh"
          git push origin HEAD:feature/verification-stage7-3-auto-population
