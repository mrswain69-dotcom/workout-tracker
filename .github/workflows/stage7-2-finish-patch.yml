name: Stage 7.2 finish patch

on:
  push:
    branches:
      - feature/verification-ui-sync-controls
    paths:
      - .github/workflows/stage7-2-finish-patch.yml
      - scripts/stage7-2-finish.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/verification-ui-sync-controls
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python scripts/stage7-2-finish.py
      - name: Verify intended patch markers
        run: |
          grep -q 'Session (structured template)' src/App.jsx
          grep -q 'One-day extra Session' src/App.jsx
          grep -q '<LogVerificationSummary' src/App.jsx
          grep -q 'Provider evidence stays separate from manual workout history and rewards.' src/components/progress/VerifiedActivityEvidenceSection.jsx
      - name: Commit intended files and remove temporary helpers
        run: |
          git config user.name "Workout Tracker automation"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/stage7-2-finish-patch.yml scripts/stage7-2-finish.py
          git add src/App.jsx src/components/progress/VerifiedActivityEvidenceSection.jsx .github/workflows/stage7-2-finish-patch.yml scripts/stage7-2-finish.py
          git diff --cached --check
          git commit -m "Finish Stage 7.2 Log verification and Session extras"
          git push origin HEAD:feature/verification-ui-sync-controls
