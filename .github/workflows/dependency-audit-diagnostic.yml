name: Dependency audit diagnostic

on:
  push:
    branches:
      - maintenance/security-deps-2026-09
    paths:
      - .github/workflows/dependency-audit-diagnostic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve current dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Capture audit and outdated data
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          npm outdated --json > /tmp/outdated.json || true
          node <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'))
          const outdated = JSON.parse(fs.readFileSync('/tmp/outdated.json', 'utf8') || '{}')
          console.log('=== AUDIT METADATA ===')
          console.log(JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2))
          console.log('=== VULNERABILITIES ===')
          for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
            const via = (v.via || []).map(x => typeof x === 'string' ? x : ({source:x.source,name:x.name,severity:x.severity,title:x.title,url:x.url,range:x.range}))
            console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable,via}, null, 2))
          }
          console.log('=== OUTDATED DIRECT/RESOLVED PACKAGES ===')
          console.log(JSON.stringify(outdated, null, 2))
          NODE
