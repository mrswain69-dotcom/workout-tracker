name: Strava webhook live activation clean

on:
  push:
    branches:
      - fix/strava-webhook-live-activation-clean
    paths:
      - scripts/strava-webhook-live-activation-clean.mjs
      - .github/workflows/strava-webhook-live-activation-clean.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/strava-webhook-live-activation-clean
      - name: Apply patch
        run: node scripts/strava-webhook-live-activation-clean.mjs
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build app
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=low
      - name: Remove temporary patch machinery
        run: rm -f scripts/strava-webhook-live-activation-clean.mjs .github/workflows/strava-webhook-live-activation-clean.yml
      - name: Commit source changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification-integration-stage2-strava.md src/engine/verificationAutomaticPolish.test.js src/groups/GroupHub.test.jsx supabase/functions/_shared/stravaProvider.ts supabase/functions/strava-webhook/index.ts scripts/strava-webhook-live-activation-clean.mjs .github/workflows/strava-webhook-live-activation-clean.yml
          git commit -m "Fix Strava webhook live activation"
          git push origin HEAD:fix/strava-webhook-live-activation-clean
