name: Group Stage 3 XP Engine Apply

on:
  push:
    branches: [feature/group-team-ecosystem]
    paths:
      - scripts/group-stage3-engine-apply.mjs
      - .github/workflows/group-stage3-engine-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/group-team-ecosystem
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/group-stage3-engine-apply.mjs
      - name: Commit Stage 3 engine integration
        run: |
          if git diff --quiet; then
            echo "Stage 3 engine integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/engine/xpEngine.js src/engine/xpEngineIntegration.test.js supabase/functions/group-xp-leaderboard
          git commit -m "Integrate shared XP engine for Group leaderboard"
          git push origin HEAD:feature/group-team-ecosystem
