name: Group Stage 3 XP Reward Map

on:
  push:
    branches: [feature/group-team-ecosystem]
    paths:
      - scripts/stage3-generate-xp-reward-map.mjs
      - .github/workflows/group-stage3-xp-map.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/group-team-ecosystem
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/stage3-generate-xp-reward-map.mjs
      - name: Commit generated lookup
        run: |
          if git diff --quiet -- src/engine/xpRewardMap.generated.js && git ls-files --error-unmatch src/engine/xpRewardMap.generated.js >/dev/null 2>&1; then
            echo "Generated lookup already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/xpRewardMap.generated.js
          git commit -m "Generate XP badge reward lookup"
          git push origin HEAD:feature/group-team-ecosystem
