name: Stage 10 App Patch

on:
  push:
    branches:
      - feature/phase1-sessions
    paths:
      - scripts/stage10-apply.mjs
      - .github/workflows/stage10-app-patch.yml

permissions:
  contents: write

jobs:
  apply-stage10:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase1-sessions
          fetch-depth: 0

      - name: Apply guarded Stage 10 patch
        run: node scripts/stage10-apply.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit Stage 10 App integration
        run: |
          if git diff --quiet; then
            echo "No Stage 10 patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/sessions/SessionPlanBlockEditor.jsx
          git commit -m "Wire Session blocks into Plan editor"
          git push origin HEAD:feature/phase1-sessions
