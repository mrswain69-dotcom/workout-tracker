name: Stage 4 Assessment Settings Integration

on:
  push:
    branches:
      - feature/phase2-assessments
    paths:
      - .github/workflows/stage4-assessment-settings-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase2-assessments
          fetch-depth: 0
      - name: Apply guarded Settings patch
        run: node scripts/stage4-integrate-assessment-settings.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/assessments/AssessmentTemplateLibrary.jsx
          git diff --cached --check
          git commit -m "Expose Assessment authoring in parent Settings"
          git push origin HEAD:feature/phase2-assessments
