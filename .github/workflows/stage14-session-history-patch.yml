name: Stage 14 Session History Closure Gate

on:
  push:
    branches:
      - feature/phase1-sessions
    paths:
      - .github/workflows/stage14-session-history-patch.yml

permissions:
  contents: write

jobs:
  validate-stage14:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout corrected feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase1-sessions
          fetch-depth: 0

      - name: Validate working-tree whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run complete test suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Remove temporary Stage 14 patch machinery
        run: |
          rm -f scripts/stage14-apply.mjs
          rm -f .github/workflows/stage14-session-history-patch.yml

      - name: Commit validated Stage 14 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No temporary Stage 14 files remain."
            exit 0
          fi
          git commit -m "Complete Stage 14 Session history gate"
          git push origin HEAD:feature/phase1-sessions
