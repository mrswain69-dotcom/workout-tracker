name: Group Stage 3 Fix

on:
  push:
    branches: [feature/group-team-ecosystem]
    paths:
      - scripts/group-stage3-fix.mjs
      - .github/workflows/group-stage3-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/group-team-ecosystem
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/group-stage3-fix.mjs
      - name: Commit Stage 3 fixes
        run: |
          if git diff --quiet; then
            echo "Stage 3 fixes already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/groups/GroupHub.jsx src/groups/GroupWeeklyXp.test.jsx supabase/functions/group-xp-leaderboard/index.ts
          git commit -m "Fix Group Weekly XP integration"
          git push origin HEAD:feature/group-team-ecosystem
