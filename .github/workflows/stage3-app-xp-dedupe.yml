name: Stage 3 App XP Dedupe

on:
  push:
    branches:
      - feature/group-team-ecosystem
    paths:
      - .github/workflows/stage3-app-xp-dedupe.yml

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/group-team-ecosystem
          fetch-depth: 0
      - name: Remove duplicate XP engine import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text()
          block = '''import {\n  buildXpDebugRows as buildXpDebugRowsEngine,\n  computeXpFromLogs as computeXpFromLogsEngine,\n} from "./engine/xpEngine.js";\n'''
          count = text.count(block)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 XP engine imports before repair, found {count}')
          first = text.find(block)
          second = text.find(block, first + len(block))
          text = text[:second] + text[second + len(block):]
          if text.count(block) != 1:
              raise SystemExit('Repair did not leave exactly one XP engine import')
          p.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 1
          git commit -m "Remove duplicate XP engine import"
          git push origin HEAD:feature/group-team-ecosystem
