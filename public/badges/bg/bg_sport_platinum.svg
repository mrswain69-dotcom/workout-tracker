<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- platinum shell -->
    <linearGradient id="sportPlatinumShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="18%" stop-color="#DDE6F0"/>
      <stop offset="48%" stop-color="#BFC7D5"/>
      <stop offset="78%" stop-color="#8895A8"/>
      <stop offset="100%" stop-color="#536172"/>
    </linearGradient>

    <!-- inner platinum bevel line -->
    <linearGradient id="sportPlatinumLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#E6F6FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#9EDFF2" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#4B5C70" stop-opacity="0.78"/>
    </linearGradient>

    <!-- dark core -->
    <linearGradient id="sportCoreDarkPlatinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="42%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>

    <!-- cyan edge whisper -->
    <linearGradient id="sportPlatinumCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- top sheen -->
    <linearGradient id="sportCoreSheenPlatinum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle grain -->
    <filter id="sportPlatinumGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
      <feComponentTransfer in="monoNoise" result="grainAlpha">
        <feFuncA type="table" tableValues="0 0.026"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainAlpha" mode="overlay"/>
    </filter>
  </defs>

  <polygon points="256,36 446,146 446,366 256,476 66,366 66,146" fill="url(#sportPlatinumShell)" />

  <polygon
    points="256,45 438,150 438,362 256,467 74,362 74,150"
    fill="none"
    stroke="url(#sportPlatinumLine)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <polygon
    points="256,45 438,150 438,362 256,467 74,362 74,150"
    fill="none"
    stroke="url(#sportPlatinumCyan)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <g filter="url(#sportPlatinumGrain)">
    <polygon
      points="256,54 430,154 430,358 256,458 82,358 82,154"
      fill="url(#sportCoreDarkPlatinum)"
    />
  </g>

  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="none"
    stroke="#0A0D12"
    stroke-width="2"
    stroke-opacity="0.42"
    stroke-linejoin="round"
  />

  <polygon
    points="138,186 374,186 352,206 160,206"
    fill="url(#sportCoreSheenPlatinum)"
    opacity="0.56"
  />
</svg>