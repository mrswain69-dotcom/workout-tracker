<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- diamond shell -->
    <linearGradient id="sportDiamondShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AEEFFF"/>
      <stop offset="14%" stop-color="#78D8F4"/>
      <stop offset="38%" stop-color="#2D8FB7"/>
      <stop offset="64%" stop-color="#133B53"/>
      <stop offset="100%" stop-color="#08131D"/>
    </linearGradient>

    <!-- inner diamond bevel line -->
    <linearGradient id="sportDiamondLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFFFFF" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#97EEFF" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#3FB8E8" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#0E2A40" stop-opacity="0.82"/>
    </linearGradient>

    <!-- dark core -->
    <linearGradient id="sportCoreDarkDiamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2631"/>
      <stop offset="42%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#090D13"/>
    </linearGradient>

    <!-- prestige glow -->
    <radialGradient id="sportDiamondGlow" cx="50%" cy="40%" r="44%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#66F0FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#66F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- light refraction lines -->
    <linearGradient id="sportDiamondRefraction" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFFFFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#DFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle grain -->
    <filter id="sportDiamondGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="13" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
      <feComponentTransfer in="monoNoise" result="grainAlpha">
        <feFuncA type="table" tableValues="0 0.024"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainAlpha" mode="screen"/>
    </filter>
  </defs>

  <polygon points="256,36 446,146 446,366 256,476 66,366 66,146" fill="url(#sportDiamondShell)" />

  <polygon
    points="256,45 438,150 438,362 256,467 74,362 74,150"
    fill="none"
    stroke="url(#sportDiamondLine)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <g filter="url(#sportDiamondGrain)">
    <polygon
      points="256,54 430,154 430,358 256,458 82,358 82,154"
      fill="url(#sportCoreDarkDiamond)"
    />
  </g>

  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="url(#sportDiamondGlow)"
  />

  <polygon
    points="170,128 312,186 246,344"
    fill="none"
    stroke="url(#sportDiamondRefraction)"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.55"
  />

  <polygon
    points="278,136 350,226 242,394"
    fill="none"
    stroke="url(#sportDiamondRefraction)"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.4"
  />

  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="none"
    stroke="#060A10"
    stroke-width="2"
    stroke-opacity="0.46"
    stroke-linejoin="round"
  />
</svg>