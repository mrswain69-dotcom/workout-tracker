<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- bronze shell -->
    <linearGradient id="sportBronzeShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D3A06B"/>
      <stop offset="18%" stop-color="#B77E48"/>
      <stop offset="48%" stop-color="#8C6239"/>
      <stop offset="78%" stop-color="#714B2B"/>
      <stop offset="100%" stop-color="#4E301B"/>
    </linearGradient>

    <!-- inner bronze bevel line -->
    <linearGradient id="sportBronzeLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1CCA1" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D39B62" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9A6437" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#5E381C" stop-opacity="0.72"/>
    </linearGradient>

    <!-- dark core -->
    <linearGradient id="sportCoreDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="42%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>

    <!-- soft top sheen -->
    <linearGradient id="sportCoreSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle grain -->
    <filter id="sportBronzeGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
      <feComponentTransfer in="monoNoise" result="grainAlpha">
        <feFuncA type="table" tableValues="0 0.03"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainAlpha" mode="overlay"/>
    </filter>
  </defs>

  <!-- OUTER BRONZE SHELL -->
  <polygon
    points="256,36 446,146 446,366 256,476 66,366 66,146"
    fill="url(#sportBronzeShell)"
  />

  <!-- THIN PREMIUM BRONZE BEVEL LINE -->
  <polygon
    points="256,45 438,150 438,362 256,467 74,362 74,150"
    fill="none"
    stroke="url(#sportBronzeLine)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <!-- DARK CORE -->
  <g filter="url(#sportBronzeGrain)">
    <polygon
      points="256,54 430,154 430,358 256,458 82,358 82,154"
      fill="url(#sportCoreDark)"
    />
  </g>

  <!-- SUBTLE CORE EDGE DEPTH -->
  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="none"
    stroke="#0A0D12"
    stroke-width="2"
    stroke-opacity="0.42"
    stroke-linejoin="round"
  />

  <!-- SOFT TOP SHEEN -->
  <polygon
    points="138,186 374,186 352,206 160,206"
    fill="url(#sportCoreSheen)"
    opacity="0.5"
  />
</svg>