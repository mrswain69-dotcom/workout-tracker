<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Early globals to prevent blank-screen crashes if old cached bundles reference them -->
    <script>
      (function () {
        // No-op toast fallback (swUpdate.js can replace with a nicer toast when loaded)
        window.showSwToast = window.showSwToast || function (onRefresh) {
          try {
            var ok = window.confirm("New version available. Refresh now?");
            if (ok && typeof onRefresh === "function") onRefresh();
          } catch (e) {}
        };

        // Global SW apply function (some older cached bundles call this)
        window.applySwUpdate = window.applySwUpdate || function () {
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
              navigator.serviceWorker
                .getRegistration()
                .then(function (reg) {
                  try {
                    if (reg && reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
                  } catch (e) {}
                })
                .finally(function () {
                  setTimeout(function () {
                    window.location.reload();
                  }, 150);
                });
            } else {
              window.location.reload();
            }
          } catch (e) {
            window.location.reload();
          }
        };
      })();
    </script>

    <title>Workout Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
