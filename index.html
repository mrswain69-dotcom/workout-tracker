<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / Branding -->
    <title>Workout Tracker</title>
    <meta name="description" content="Build Strength. Build Habits." />
    <meta name="theme-color" content="#ff7a18" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Early globals to prevent blank-screen crashes if old cached bundles reference them -->
    <script>
      (function () {
        window.showSwToast = window.showSwToast || function (onRefresh) {
          try {
            var ok = window.confirm("New version available. Refresh now?");
            if (ok && typeof onRefresh === "function") onRefresh();
          } catch (e) {}
        };

        window.applySwUpdate = window.applySwUpdate || function () {
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
              navigator.serviceWorker.getRegistration().then(function (reg) {
                try {
                  if (reg && reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
                } catch (e) {}
              }).finally(function () {
                setTimeout(function(){ window.location.reload(); }, 150);
              });
            } else {
              window.location.reload();
            }
          } catch (e) {
            window.location.reload();
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
