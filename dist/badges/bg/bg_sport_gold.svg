<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- gold shell -->
    <linearGradient id="sportGoldShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE89A"/>
      <stop offset="18%" stop-color="#F3CF63"/>
      <stop offset="48%" stop-color="#D4AF37"/>
      <stop offset="78%" stop-color="#A9851F"/>
      <stop offset="100%" stop-color="#6F5410"/>
    </linearGradient>

    <!-- inner gold bevel line -->
    <linearGradient id="sportGoldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6D1" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#D8B540" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#7A5E12" stop-opacity="0.76"/>
    </linearGradient>

    <!-- dark core -->
    <linearGradient id="sportCoreDarkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="42%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>

    <!-- soft gold glow -->
    <radialGradient id="sportGoldGlow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#FFD700" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <!-- soft top sheen -->
    <linearGradient id="sportCoreSheenGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle grain -->
    <filter id="sportGoldGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
      <feComponentTransfer in="monoNoise" result="grainAlpha">
        <feFuncA type="table" tableValues="0 0.028"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainAlpha" mode="overlay"/>
    </filter>
  </defs>

  <polygon points="256,36 446,146 446,366 256,476 66,366 66,146" fill="url(#sportGoldShell)" />

  <polygon
    points="256,45 438,150 438,362 256,467 74,362 74,150"
    fill="none"
    stroke="url(#sportGoldLine)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <g filter="url(#sportGoldGrain)">
    <polygon
      points="256,54 430,154 430,358 256,458 82,358 82,154"
      fill="url(#sportCoreDarkGold)"
    />
  </g>

  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="url(#sportGoldGlow)"
  />

  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="none"
    stroke="#0A0D12"
    stroke-width="2"
    stroke-opacity="0.42"
    stroke-linejoin="round"
  />

  <polygon
    points="138,186 374,186 352,206 160,206"
    fill="url(#sportCoreSheenGold)"
    opacity="0.56"
  />
</svg>