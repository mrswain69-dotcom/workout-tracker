<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- silver shell -->
    <linearGradient id="sportSilverShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF3F8"/>
      <stop offset="18%" stop-color="#D8E0E8"/>
      <stop offset="48%" stop-color="#BFC7D1"/>
      <stop offset="78%" stop-color="#8F99A6"/>
      <stop offset="100%" stop-color="#5F6875"/>
    </linearGradient>

    <!-- inner silver bevel line -->
    <linearGradient id="sportSilverLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="35%" stop-color="#E5ECF3" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#B7C1CC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#707987" stop-opacity="0.74"/>
    </linearGradient>

    <!-- dark core -->
    <linearGradient id="sportCoreDarkSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="42%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>

    <!-- soft top sheen -->
    <linearGradient id="sportCoreSheenSilver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle grain -->
    <filter id="sportSilverGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
      <feComponentTransfer in="monoNoise" result="grainAlpha">
        <feFuncA type="table" tableValues="0 0.028"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainAlpha" mode="overlay"/>
    </filter>
  </defs>

  <polygon points="256,36 446,146 446,366 256,476 66,366 66,146" fill="url(#sportSilverShell)" />

  <polygon
    points="256,45 438,150 438,362 256,467 74,362 74,150"
    fill="none"
    stroke="url(#sportSilverLine)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <g filter="url(#sportSilverGrain)">
    <polygon
      points="256,54 430,154 430,358 256,458 82,358 82,154"
      fill="url(#sportCoreDarkSilver)"
    />
  </g>

  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="none"
    stroke="#0A0D12"
    stroke-width="2"
    stroke-opacity="0.42"
    stroke-linejoin="round"
  />

  <polygon
    points="138,186 374,186 352,206 160,206"
    fill="url(#sportCoreSheenSilver)"
    opacity="0.52"
  />
</svg>