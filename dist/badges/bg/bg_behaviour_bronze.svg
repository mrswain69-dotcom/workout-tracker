<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- bronze body -->
    <linearGradient id="bronzeMetal_ultraslim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D7B3"/>
      <stop offset="18%" stop-color="#E4B27A"/>
      <stop offset="45%" stop-color="#C9873F"/>
      <stop offset="72%" stop-color="#9C5C22"/>
      <stop offset="100%" stop-color="#5B2F0E"/>
    </linearGradient>

    <!-- premium inner bronze line -->
    <linearGradient id="bronzeLine_ultraslim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE8C9" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#F2C48F" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#B46B2A" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#6A3710" stop-opacity="0.72"/>
    </linearGradient>

    <!-- behaviour cyan core -->
    <radialGradient id="behaviourCore_ultraslim" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#27F0FF"/>
      <stop offset="55%" stop-color="#0B8AA0"/>
      <stop offset="100%" stop-color="#052433"/>
    </radialGradient>

    <!-- subtle top sheen across the core -->
    <linearGradient id="coreShine_ultraslim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- OUTER HEX -->
  <polygon
    points="256,36 446,146 446,366 256,476 66,366 66,146"
    fill="url(#bronzeMetal_ultraslim)"
  />

  <!-- THIN PREMIUM BRONZE LINE -->
  <polygon
    points="256,43 440,149 440,363 256,469 72,363 72,149"
    fill="none"
    stroke="url(#bronzeLine_ultraslim)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- CYAN CORE -->
  <polygon
    points="256,47 435,150 435,362 256,465 77,362 77,150"
    fill="url(#behaviourCore_ultraslim)"
  />

  <!-- subtle inner depth line on core edge -->
  <polygon
    points="256,47 435,150 435,362 256,465 77,362 77,150"
    fill="none"
    stroke="#04202D"
    stroke-width="2.5"
    stroke-opacity="0.42"
    stroke-linejoin="round"
  />

  <!-- soft reflective sheen -->
  <polygon
    points="126,184 386,184 362,206 150,206"
    fill="url(#coreShine_ultraslim)"
    opacity="0.55"
  />
</svg>