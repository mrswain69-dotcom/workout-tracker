<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{margin:0;padding:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a}
    .wrap{width:100%;padding:32px 16px;box-sizing:border-box}
    .card{max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}
    .brand{padding:24px 28px;background:#0f172a;color:#ffffff;font-size:20px;font-weight:800;letter-spacing:-.02em}
    .body{padding:30px 28px}
    h1{font-size:26px;line-height:1.2;margin:0 0 14px}
    p{font-size:15px;line-height:1.6;margin:0 0 16px;color:#334155}
    .btn{display:inline-block;background:#0f172a;color:#ffffff!important;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:10px;margin:8px 0 20px}
    .note{background:#f8fafc;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.55;color:#475569}
    .footer{max-width:560px;margin:16px auto 0;text-align:center;font-size:12px;line-height:1.5;color:#64748b}
    .footer a{color:#475569}
  </style></head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">Workout Tracker</div>
      <div class="body">
        <h1>Confirm your new email address</h1>
        <p>Confirm this email address to complete the change on your Workout Tracker account.</p>
        <p><a class="btn" href="{{ .ConfirmationURL }}">Confirm new email</a></p>
        <div class="note">If you did not request this change, do not use the link and contact support.</div>
      </div>
    </div>
    <div class="footer">Workout Tracker account security · <a href="mailto:support@workouttrackerapp.io">support@workouttrackerapp.io</a></div>
  </div>
</body>
</html>
